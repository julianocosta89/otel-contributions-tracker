name: Send monthly Datadog contribution report

on:
  schedule:
    - cron: '0 8 1 * *'  # 08:00 UTC on the 1st of every month
  workflow_dispatch:        # manual trigger from Actions UI (also useful for --dry-run style testing)

permissions:
  contents: write

concurrency:
  group: otel-monthly-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REPORT_FROM: contrib-tracker@otelminutes.jcosta.dev
      REPORT_TO: juliano.costa@datadoghq.com
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Send Datadog monthly report
        run: node scripts/send-monthly-report.mjs

      - name: Commit updated report snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/datadog-monthly-report.json
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit"
          else
            git commit -m "data: record Datadog monthly report snapshot $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
