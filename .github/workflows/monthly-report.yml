name: Send monthly Datadog contribution report

on:
  schedule:
    - cron: '0 8 1 * *'  # 08:00 UTC on the 1st of every month
  workflow_dispatch:        # manual trigger from Actions UI (also useful for --dry-run style testing)

permissions:
  contents: write

concurrency:
  group: otel-monthly-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REPORT_FROM: ${{ secrets.REPORT_FROM }}
      REPORT_TO: ${{ secrets.REPORT_TO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Send Datadog monthly report
        run: node scripts/send-monthly-report.mjs

      - name: Commit updated report snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/datadog-monthly-report.json
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit"
          else
            git commit -m "data: record Datadog monthly report snapshot $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
