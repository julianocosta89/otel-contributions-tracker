name: Refresh contribution data

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC every day
  workflow_dispatch:        # manual trigger from Actions UI

permissions:
  contents: write

concurrency:
  group: otel-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # attribution enrichment makes extra sub-period API calls; 60 min matches refresh-affiliations

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Fetch OpenTelemetry contributions from LF Insights
        # fetch-data.mjs reads data/affiliations.json at startup for attribution enrichment.
        # affiliations.json is committed and checked out above — no need to regenerate it here.
        # Note: on Mondays this runs at 06:00 UTC before refresh-affiliations.yml fires at 07:00,
        # so Monday's cache uses the previous week's affiliations (Tuesday onward picks up the fresh ones).
        run: node scripts/fetch-data.mjs

      - name: Commit updated cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache.json
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit"
          else
            git commit -m "data: refresh contributions $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi

      # A failure here is easy to miss (only visible on the Actions tab), and this
      # workflow is the only thing keeping data/cache.json from going stale — the
      # site has no live-API fallback (CORS blocks it on this deployment, so that
      # path was removed rather than left silently broken), so it depends entirely
      # on this cache being kept current. Reports on every run (not just failures)
      # so the Datadog monitor always has a fresh data point to evaluate — a metric
      # that only ever gets sent on failure can't tell "still failing" apart from
      # "hasn't run in a while", and would never show a recovery.
      - name: Report refresh status to Datadog
        if: always()
        continue-on-error: true   # a Datadog API hiccup (or a not-yet-configured secret) shouldn't fail an otherwise-successful refresh
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          STATUS_VALUE=0
          if [ "${{ job.status }}" != "success" ]; then STATUS_VALUE=1; fi
          curl -sS --fail-with-body -X POST "https://api.datadoghq.eu/api/v2/series" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d "{
              \"series\": [{
                \"metric\": \"otel_contributions_tracker.refresh_data.status\",
                \"type\": 3,
                \"points\": [{ \"timestamp\": $(date +%s), \"value\": ${STATUS_VALUE} }],
                \"tags\": [\"repository:${{ github.repository }}\", \"workflow:refresh-data\"]
              }]
            }"
