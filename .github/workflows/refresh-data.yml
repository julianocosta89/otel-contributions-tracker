name: Refresh contribution data

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC every day
  workflow_dispatch:        # manual trigger from Actions UI

permissions:
  contents: write
  issues: write   # lets the failure step below open/comment on an issue

concurrency:
  group: otel-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # attribution enrichment makes extra sub-period API calls; 60 min matches refresh-affiliations

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Fetch OpenTelemetry contributions from LF Insights
        # fetch-data.mjs reads data/affiliations.json at startup for attribution enrichment.
        # affiliations.json is committed and checked out above — no need to regenerate it here.
        # Note: on Mondays this runs at 06:00 UTC before refresh-affiliations.yml fires at 07:00,
        # so Monday's cache uses the previous week's affiliations (Tuesday onward picks up the fresh ones).
        run: node scripts/fetch-data.mjs

      - name: Commit updated cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache.json
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit"
          else
            git commit -m "data: refresh contributions $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi

      # A failure here is easy to miss (only visible on the Actions tab), and this
      # workflow is the only thing keeping data/cache.json from going stale — the
      # site has no live-API fallback (CORS blocks it on this deployment, so that
      # path was removed rather than left silently broken), so it depends entirely
      # on this cache being kept current. One issue per failure streak: if it's
      # already open, comment instead of opening a duplicate for every failed run.
      - name: Open or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Scheduled data refresh is failing"
          BODY="The [data refresh run]($RUN_URL) failed on $(date -u '+%Y-%m-%d'). \`data/cache.json\` was not updated — the site is still serving the last successfully-fetched data, but it'll get increasingly stale if this keeps failing. See the run logs for details."
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
